    <rect x="0" y="620" width="1600" height="34" opacity="0.28"/>
    <rect x="0" y="672" width="1600" height="30" opacity="0.34"/>
    <rect x="0" y="720" width="1600" height="28" opacity="0.42"/>
    <rect x="0" y="766" width="1600" height="26" opacity="0.5"/>
    <rect x="0" y="810" width="1600" height="90" opacity="0.6"/>
  </g>

  <!-- sendero de piedra -->
  <path d="M760,900 C740,800 820,720 800,620" fill="none" stroke="#D4AF37" stroke-width="10" opacity="0.35" stroke-linecap="round"/>
