<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3ea"/>
      <stop offset="100%" stop-color="#fffbf0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky2)"/>

  <!-- montañas lejanas -->
  <polygon fill="#9fbfae" opacity="0.6" points="0,520 200,450 420,510 660,440 900,500 1140,440 1380,505 1600,460 1600,900 0,900"/>

  <!-- terrazas de cultivo (andenes) -->
